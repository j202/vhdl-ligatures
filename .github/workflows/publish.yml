name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose .vsix asset is published
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # VSCE_PAT lives here, not as a repository secret, so no other workflow
    # can reach it. The environment only accepts runs on v* tags.
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Only vsce is needed, at the lockfile's version; postinstall would
      # fetch the grammar.
      - run: npm ci --ignore-scripts

      # The .vsix attached to the release is the file that gets published, so
      # the Marketplace package and the release asset are the same bytes.
      - name: Download the release's .vsix
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}

      # vsce publishes the version inside the package, so a mismatch with the
      # tag would publish under the wrong version.
      - name: Verify the .vsix version matches the tag
        run: |
          VSIX_VERSION=$(unzip -p ./*.vsix extension/package.json | jq -r .version)
          if [ "v$VSIX_VERSION" != "$TAG" ]; then
            echo "::error::.vsix version v$VSIX_VERSION does not match tag $TAG"
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - run: npx vsce publish -p "$VSCE_PAT" --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
