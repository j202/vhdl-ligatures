name: Publish to Marketplace

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # vsce publishes whatever version is in package.json, not the release's
      # git tag - if someone drafts a release without bumping package.json
      # first, this would silently republish the old version instead of
      # failing, so check the two agree before doing anything irreversible.
      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run package

      # Uploaded before the Marketplace publish step, deliberately - a
      # downloadable .vsix on the release should still exist even if
      # publishing to the Marketplace itself fails.
      - name: Attach the .vsix to the GitHub Release
        run: gh release upload "${{ github.event.release.tag_name }}" *.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - run: npx vsce publish -p "${{ secrets.VSCE_PAT }}"
