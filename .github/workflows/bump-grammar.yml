name: Check upstream grammar

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - id: update-grammar
        run: |
          node scripts/update-grammar.mjs latest
          echo "tag=$(jq -r .tag grammar/tree-sitter-vhdl.version.json)" >> "$GITHUB_OUTPUT"

      - run: npm test

      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: grammar/tree-sitter-vhdl.version.json
          branch: bump-tree-sitter-vhdl-grammar-${{ steps.update-grammar.outputs.tag }}
          commit-message: 'fix(grammar): bump tree-sitter-vhdl pin to ${{ steps.update-grammar.outputs.tag }}'
          title: 'fix(grammar): bump tree-sitter-vhdl pin to ${{ steps.update-grammar.outputs.tag }}'
          body: >
            tree-sitter-vhdl ${{ steps.update-grammar.outputs.tag }} passed the
            test suite against grammar.ts's assumptions about upstream node
            types and behavior.
